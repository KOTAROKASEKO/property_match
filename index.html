  <style>
    /* ローディング画面のデザイン */
    #loading_container {
      position: fixed;

      transition: opacity 0.5s ease-out;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #3498db; /* 青色 */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px; 
    }

    #tips_text {
      font-size: 16px;
      color: #555;
      text-align: center;
      max-width: 80%;
      line-height: 1.5;
      min-height: 1.5em; 
      font-weight: 500;
      transition: opacity 0.5s ease; 
      opacity: 1;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
  // 豆知識リスト
  const tips = [
    "マレーシアは移住したい国ランキング14年連続1位です", 
    "マレーシアは基本的に初期費用として3ヶ月分の家賃を払います",
    "コンドミニアムにはプールとジムがついているのが一般的です",
    "家賃交渉はエージェントを通して行うのが一般的です",
    "多民族国家なので、英語、マレー語、中国語が飛び交っています"
  ];

  const tipsElement = document.getElementById('tips_text');

  // 🔹 ランダムな開始位置
  let currentTipIndex = Math.floor(Math.random() * tips.length);

  // 最初にランダムな豆知識を表示
  tipsElement.innerText = tips[currentTipIndex];

  // テキスト切り替え関数（1つずつ進む）
  function rotateTips() {
    tipsElement.style.opacity = '0';

    setTimeout(() => {
      currentTipIndex = (currentTipIndex + 1) % tips.length;
      tipsElement.innerText = tips[currentTipIndex];
      tipsElement.style.opacity = '1';
    }, 500);
  }

  // 3.5秒ごとに切り替え
  const tipInterval = setInterval(rotateTips, 3500);

  // Flutter 初回描画後にローディング解除
  window.addEventListener('flutter-first-frame', function() {
    clearInterval(tipInterval);

    const loadingContainer = document.getElementById('loading_container');
    if (loadingContainer) {
      loadingContainer.style.opacity = '0';
      setTimeout(() => {
        loadingContainer.remove();
      }, 500);
    }
  });
</script>
